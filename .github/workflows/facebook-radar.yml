name: Radar Intelijen Facebook (WhaleGuard)

on:
  schedule:
    - cron: '0 23 * * *' # Jalan otomatis setiap hari pukul 06:00 WIB
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo WhaleGuard
        uses: actions/checkout@v4

      - name: Pindai grup terbuka & postingan Facebook
        id: radar
        run: python3 scripts/facebook_radar.py

      - name: Buka Issue Rangkuman jika ada temuan baru
        if: steps.radar.outputs.has_findings == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('facebook_report.md', 'utf8');
            const tgl = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Radar Facebook]: Temuan Grup Pinjol & Penipuan (${tgl})`,
              labels: ['radar-intel'],
              body: body
            });

      - name: Simpan catatan riwayat pemindaian
        if: always()
        run: |
          if [ ! -f .github/facebook_seen.json ]; then
            echo "File state belum ada, melewati commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/facebook_seen.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(radar): update seen Facebook posts [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
                exit 0
              fi
              sleep 5
            done
          fi
