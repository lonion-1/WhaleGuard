name: Auto-Harvester & Sapu Bersih (WhaleGuard)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'inbox/raw_numbers.txt'
      - 'rules/numbers-allowlist.txt'
  schedule:
    - cron: '0 23 * * *' # Jalan otomatis setiap hari pukul 06:00 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whaleguard-rules
  cancel-in-progress: false

jobs:
  harvest-numbers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo WhaleGuard
        uses: actions/checkout@v4

      - name: Panen nomor dari inbox/feed & sapu bersih allowlist
        run: python3 scripts/number_harvester.py

      - name: Jalankan validator anti-false-positive & update README
        run: python3 scripts/validate_and_build.py

      - name: Commit otomatis ke rules & README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/ inbox/raw_numbers.txt README.md last-run.txt
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          git commit -m "chore(rules): auto-harvest & clean allowlist [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
