name: Auto-Harvester & Sapu Bersih (WhaleGuard)

on:
  push:
    paths:
      - 'inbox/raw_numbers.txt'
      - 'rules/numbers-allowlist.txt'
  issues:
    types: [opened]
  schedule:
    - cron: '0 23 * * *' # Cadangan otomatis setiap hari pukul 06:00 WIB
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Antre, jangan jalan paralel (hindari bentrok di inbox/raw_numbers.txt)
concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest-numbers:
    if: github.event_name != 'issues' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo WhaleGuard
        uses: actions/checkout@v4

      - name: Tampung isi Issue baru ke inbox (jika pemicunya Issue)
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p inbox
          printf "\n%s\n%s\n" "$ISSUE_TITLE" "$ISSUE_BODY" >> inbox/raw_numbers.txt

      - name: Panen nomor baru & sapu bersih allowlist
        run: python3 scripts/number_harvester.py

      - name: Jalankan validator anti-false-positive
        run: |
          if [ -f scripts/validate_and_build.py ]; then
            python3 scripts/validate_and_build.py
          fi

      - name: Commit otomatis ke rules/numbers-spam-id.txt
        id: commit
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Catat dulu apakah file rules benar-benar berubah
          RULES_CHANGED=false
          if [ -n "$(git status --porcelain -- rules/numbers-spam-id.txt)" ]; then
            RULES_CHANGED=true
          fi

          git add rules/numbers-spam-id.txt inbox/raw_numbers.txt
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            echo "harvested=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(rules): auto-harvest & clean rules"

          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              echo "harvested=${RULES_CHANGED}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          echo "::error::Push gagal setelah 3 percobaan."
          exit 1

      - name: Balas & tutup Issue (nomor berhasil dipanen)
        if: github.event_name == 'issues' && steps.commit.outputs.harvested == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Nomor valid dari laporan ini telah otomatis dipanen ke `rules/numbers-spam-id.txt` (dilindungi filter allowlist).'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Balas & tutup Issue (tidak ada nomor baru)
        if: github.event_name == 'issues' && steps.commit.outputs.harvested != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'ℹ️ Tidak ada nomor baru yang ditambahkan. Kemungkinan nomornya sudah tercatat, tidak valid, atau dilindungi allowlist.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
