name: Auto-Harvester & Sapu Bersih (WhaleGuard)

on:
  push:
    paths:
      - 'inbox/raw_numbers.txt'
      - 'rules/numbers-allowlist.txt'
  issues:
    types: [opened]
  schedule:
    - cron: '0 23 * * *' # Cadangan otomatis setiap hari pukul 06:00 WIB
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  harvest-numbers:
    if: github.event_name != 'issues' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo WhaleGuard
        uses: actions/checkout@v4

      - name: Tampung isi Issue baru ke inbox (jika pemicunya Issue)
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf "\n%s\n%s\n" "$ISSUE_TITLE" "$ISSUE_BODY" >> inbox/raw_numbers.txt

      - name: Panen nomor baru & sapu bersih allowlist
        run: python3 scripts/number_harvester.py

      - name: Jalankan validator anti-false-positive
        run: |
          if [ -f scripts/validate_and_build.py ]; then
            python3 scripts/validate_and_build.py
          fi

      - name: Commit otomatis ke rules/numbers-spam-id.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/numbers-spam-id.txt inbox/raw_numbers.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore(rules): auto-harvest & clean rules"
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
                exit 0
              fi
              sleep 5
            done
          fi

      - name: Tutup Issue laporan yang sudah diproses
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Nomor valid dari laporan ini telah otomatis dipanen ke `rules/numbers-spam-id.txt` (dilindungi filter allowlist).'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
