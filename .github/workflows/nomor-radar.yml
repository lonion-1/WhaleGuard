name: Radar Nomor Autopilot (WhaleGuard)
# Copyright (c) 2026 EazyWhale (https://github.com/lonion-1/WhaleGuard)
# SPDX-License-Identifier: AGPL-3.0-or-later

on:
  schedule:
    - cron: '0 22 * * *' # Jalan otomatis setiap hari pukul 05:00 WIB
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (pindai & simulasi tanpa menulis file)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: whaleguard-rules
  cancel-in-progress: false

jobs:
  scan-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repo WhaleGuard
        uses: actions/checkout@v4

      - name: Pasang Python 3.12 (tomllib bawaan)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validasi config radar nomor
        run: python3 scripts/nomor_radar.py --check-config

      - name: Pindai & panen otomatis nomor penipu (Telegram, Reddit & Open Web)
        id: radar
        continue-on-error: true
        timeout-minutes: 8
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/nomor_radar.py --dry-run
          else
            python3 scripts/nomor_radar.py
          fi

      - name: Sinkronisasi remote & jalankan validator anti-false-positive
        if: ${{ !inputs.dry_run }}
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort 2>/dev/null || true
          python3 scripts/validate_and_build.py

      - name: Commit otomatis aturan, riwayat radar & README
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi
          git commit -m "chore(radar): auto-add nomor penipu & sumber baru [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || {
              git rebase --abort 2>/dev/null || true
              exit 1
            }
            python3 scripts/validate_and_build.py
            git add -A
            git commit --amend --no-edit
            sleep 5
          done
          exit 1

      - name: Tandai merah bila radar gagal (setelah hasil tersimpan)
        if: steps.radar.outcome == 'failure'
        run: |
          echo "::error::Radar nomor gagal — cek log step 'Pindai & panen otomatis'. Validator & commit tetap dijalankan."
          exit 1
