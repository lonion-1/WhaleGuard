[scam]
explicit_report_regex = [
  '(?:no|nomor|wa|whatsapp|tlp|telp)\s*(?:penipu|pelaku|dc|teror|scammer|spammer)',
  '(?:penipu|pelaku|akun)\s*(?:pakai|pake|menggunakan|atas\s*nama|mengaku)',
  'salah\s*guna\w*', 'salahgunain', 'kronologi', 'viralkan', 'bantu\s*up',
  'blacklist\s*(?:nomor|no|wa)', 'teror\s*(?:pinjol|dc|debt\s*collector)',
  'sebar\s*(?:data|kontak|ktp)', 'undangan\s*apk', 'file\s*apk',
  'penipuan\s*(?:wa|whatsapp|online|segitiga|giveaway|loker|investasi)',
]

